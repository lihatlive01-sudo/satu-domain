<script>
// ============================================
// 1. CONFIGURATION
// ============================================
const ENCRYPTION_KEY = '112233'; // 🔐 Sesuai dengan generator & player
const SMARTLINKS = [
  "https://www.profitableratecpmnetwork.com/cb53k6wcm8?key=7eed13583d3d505b1aa241e65deb6fb7",
  "https://www.profitableratecpmnetwork.com/bb1ic94xj9?key=7cee48daf3ca4dbf1a9ac037bf4a08d5"
];

function getRandomSmartlink() {
  return SMARTLINKS[Math.floor(Math.random() * SMARTLINKS.length)];
}

function showAlert(msg) {
  const alertBox = document.getElementById('errorAlert');
  alertBox.textContent = msg;
  alertBox.classList.add('visible');
}

// ============================================
// 2. MULTI-ENGINE ROBUST DECRYPTION
// ============================================
function decryptDownloadLink(encrypted) {
  if (!encrypted) return null;

  // Bersihkan string input - ambil nilai parameter saja
  let clean = encrypted.trim();
  
  // Decode URI jika ter-encode dari URL
  try {
    clean = decodeURIComponent(clean);
  } catch (e) {}
  
  // Normalisasi space menjadi '+' untuk Base64
  const candidates = [clean.replace(/ /g, '+'), clean];

  // Percobaan 1: XOR Decryption (sesuai format encryptPayload)
  // encryptPayload: encodeURIComponent(text) → XOR → btoa
  // Jadi dekripsi: atob → XOR → decodeURIComponent
  for (const candidate of candidates) {
    try {
      const rawDecoded = atob(candidate);
      let xorResult = '';
      for (let i = 0; i < rawDecoded.length; i++) {
        xorResult += String.fromCharCode(rawDecoded.charCodeAt(i) ^ ENCRYPTION_KEY.charCodeAt(i % ENCRYPTION_KEY.length));
      }
      // xorResult sekarang adalah encodeURIComponent(url), jadi decode lagi
      const finalUrl = decodeURIComponent(xorResult);
      if (finalUrl && (finalUrl.startsWith('http://') || finalUrl.startsWith('https://'))) {
        return finalUrl;
      }
    } catch (e) {}
  }

  // Percobaan 2: Mungkin data berupa JSON string terenkripsi (dari player payload)
  for (const candidate of candidates) {
    try {
      const rawDecoded = atob(candidate);
      let xorResult = '';
      for (let i = 0; i < rawDecoded.length; i++) {
        xorResult += String.fromCharCode(rawDecoded.charCodeAt(i) ^ ENCRYPTION_KEY.charCodeAt(i % ENCRYPTION_KEY.length));
      }
      const decoded = decodeURIComponent(xorResult);
      const parsed = JSON.parse(decoded);
      if (parsed && parsed.src && (parsed.src.startsWith('http://') || parsed.src.startsWith('https://'))) {
        return parsed.src;
      }
    } catch (e) {}
  }

  // Percobaan 3: Base64 Biasa (tanpa XOR)
  for (const candidate of candidates) {
    try {
      const plainB64 = atob(candidate);
      const decodedPlain = decodeURIComponent(plainB64);
      if (decodedPlain && (decodedPlain.startsWith('http://') || decodedPlain.startsWith('https://'))) {
        return decodedPlain;
      }
    } catch (e) {}
  }

  // Percobaan 4: URL Decode Biasa
  try {
    const urlDecoded = decodeURIComponent(clean);
    if (urlDecoded && (urlDecoded.startsWith('http://') || urlDecoded.startsWith('https://'))) {
      return urlDecoded;
    }
  } catch (e) {}

  // Percobaan 5: Mungkin sudah plain URL
  if (clean.startsWith('http://') || clean.startsWith('https://')) {
    return clean;
  }

  return null;
}

// ============================================
// 3. ULTRA-LIGHT SINGLE MASTER CLOCK ENGINE
// 1 loop interval tunggal mengurus kedua hitungan secara sinkron
// ============================================
let overlaySecondsLeft = 15;
let mainSecondsLeft = 10;
let isOverlayFinished = false;
let isMainDownloadReady = false;
let masterClockInstance = null;

function runUnifiedClock(finalUrl) {
  const dialog = document.getElementById('nativeDialogLayer');
  const closeBtn = document.getElementById('dialogCloseBtn');
  const overlaySecDisplay = document.getElementById('overlaySecondCount');
  const mainDigitTimer = document.getElementById('mainDigitTimer');
  const dlBtn = document.getElementById('btnDownloadAction');

  // Buka overlay modal di awal
  dialog.classList.add('visible');
  dialog.style.display = 'block';
  document.body.style.overflow = 'hidden';

  // Master Timer (1 interval per detik = beban CPU turun drastis)
  masterClockInstance = setInterval(() => {
    // 1. Update Hitungan Halaman Utama (10 detik)
    if (!isMainDownloadReady) {
      mainSecondsLeft--;
      if (mainDigitTimer) mainDigitTimer.textContent = mainSecondsLeft;

      if (mainSecondsLeft <= 0) {
        isMainDownloadReady = true;

        // Buka sponsor smartlink
        const targetSmartlink = getRandomSmartlink();
        if (targetSmartlink && targetSmartlink.startsWith('http')) {
          window.open(targetSmartlink, '_blank');
        }

        // Aktifkan tombol unduhan
        dlBtn.disabled = false;
        dlBtn.classList.add('active');
        dlBtn.innerHTML = '⬇️ Unduh Sekarang';
        dlBtn.onclick = () => {
          // Gunakan anchor noreferrer agar tidak mengirim Referer header
          // (mencegah 403 dari server CDN seperti twimg.com)
          const a = document.createElement('a');
          a.href = finalUrl;
          a.rel = 'noreferrer noopener';
          a.referrerPolicy = 'no-referrer';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };
      }
    }

    // 2. Update Hitungan Overlay Modal (15 detik)
    if (!isOverlayFinished) {
      overlaySecondsLeft--;
      if (overlaySecDisplay) overlaySecDisplay.textContent = overlaySecondsLeft;

      if (overlaySecondsLeft <= 0) {
        isOverlayFinished = true;
        closeDialogOverlay();
      }
    }

    // Jika kedua hitungan sudah selesai, matikan interval jam sentral sepenuhnya
    if (isMainDownloadReady && isOverlayFinished) {
      clearInterval(masterClockInstance);
    }
  }, 1000);

  // Trap Close Button Logic
  closeBtn.onclick = function() {
    if (!isOverlayFinished) {
      const targetSmartlink = getRandomSmartlink();
      if (targetSmartlink && targetSmartlink.startsWith('http')) {
        window.open(targetSmartlink, '_blank');
      }
      alert('🕐 Mohon tunggu hingga waktu verifikasi selesai (15 detik) untuk melanjutkan unduhan!');
      closeBtn.style.animation = 'shakeAnim 0.5s';
      setTimeout(() => { closeBtn.style.animation = ''; }, 500);
    } else {
      closeDialogOverlay();
    }
  };
}

function closeDialogOverlay() {
  const dialog = document.getElementById('dialogPenaltyLayer') || document.getElementById('nativeDialogLayer');
  if (dialog) {
    dialog.classList.remove('visible');
    dialog.style.display = 'none';
  }
  document.body.style.overflow = 'auto';
}

function getDownloadParam() {
  const url = new URL(window.location.href);
  let param = url.searchParams.get('dl') || url.searchParams.get('s') || url.searchParams.get('data');
  if (!param && window.location.hash) {
    param = window.location.hash.replace(/^#dl=|^#/, '');
  }
  return param ? param.trim() : '';
}

// ============================================
// 4. INITIALIZATION
// ============================================
let isClockStarted = false;

function initSafeLink() {
  if (isClockStarted) return;
  const hashParam = getDownloadParam();
  
  if (!hashParam) {
    showAlert('❌ Parameter unduhan tidak ditemukan (#dl= kosong).');
    return;
  }

  const resolvedUrl = decryptDownloadLink(hashParam);
  if (!resolvedUrl) {
    showAlert('❌ Tautan unduhan tidak valid atau kunci dekripsi tidak sesuai.');
    return;
  }

  isClockStarted = true;
  runUnifiedClock(resolvedUrl);
}

// Auto-run instantly
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initSafeLink);
} else {
  initSafeLink();
}
setTimeout(initSafeLink, 100);
</script>
